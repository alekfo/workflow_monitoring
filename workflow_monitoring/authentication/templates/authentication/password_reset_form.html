{% extends 'authentication/password_reset_base.html' %}
{% block content %}
<p>Введите email, указанный при регистрации. Мы отправим ссылку для создания нового пароля.</p>
<form method="post">
    {% csrf_token %}
    {% include 'authentication/password_reset_fields.html' %}
    <button type="submit" class="btn-auth">Отправить ссылку</button>
</form>
{% endblock %}
