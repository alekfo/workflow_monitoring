name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-secret-key-not-used-in-prod"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r workflow_monitoring/requirements.txt

      - name: Run migrations
        working-directory: workflow_monitoring
        run: python manage.py migrate --no-input

      - name: Run tests
        working-directory: workflow_monitoring
        run: python manage.py test signal1520 --verbosity=2

  deploy:
    needs: test  # deploy запустится только если test прошёл
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # только на реальный пуш в main (после мерджа PR), не на сам PR

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            DUMP_FILE="/home/alek_fo/dumps/workflow_db_dump_$(date +%Y%m%d_%H%M%S).sql"
            docker exec workflow_monitoring-db-1 sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$DUMP_FILE"
            echo "DB dump saved: $DUMP_FILE"
            LOG_FILE="/home/alek_fo/logs/app_logs_$(date +%Y%m%d_%H%M%S).txt"
            docker compose -f /home/alek_fo/workflow_monitoring_git/workflow_monitoring/docker-compose.yml logs web > "$LOG_FILE" 2>&1 || true
            echo "App logs saved: $LOG_FILE"
            cd /home/alek_fo/workflow_monitoring_git  # корень git-репозитория
            git pull origin main
            cd workflow_monitoring  # сюда, где лежит docker-compose.yml
            docker compose build --no-cache web
            docker compose up -d
