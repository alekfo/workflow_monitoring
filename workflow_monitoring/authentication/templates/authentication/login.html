{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{% static 'authentication/css/auth_styles.css' %}?v=20261008">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.15em;margin-right:0.4em"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Вход в систему</h2>
                <p>Добро пожаловать!</p>
            </div>

            <div class="auth-body">
                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="non-field-errors">
                            Неверное имя пользователя или пароль
                        </div>
                    {% endif %}

                    <div class="form-group">
                        <label for="id_username">
                            Имя пользователя
                            <span style="color: #e74c3c;">*</span>
                        </label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" required autofocus
                               placeholder="Введите имя пользователя">
                    </div>

                    <div class="form-group">
                        <label for="id_password">
                            Пароль
                            <span style="color: #e74c3c;">*</span>
                        </label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" required
                               placeholder="Введите пароль">
                    </div>

                    <button type="submit" class="btn-auth">
                        Войти
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <p>Нет аккаунта?</p>
                <a href="{% url 'authentication:register' %}">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</body>
</html>
