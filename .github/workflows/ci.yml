name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-secret-key-not-used-in-prod"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r workflow_monitoring/requirements.txt

      - name: Run migrations
        working-directory: workflow_monitoring
        run: python manage.py migrate --no-input

      - name: Run tests
        working-directory: workflow_monitoring
        run: python manage.py test signal1520 --verbosity=2
