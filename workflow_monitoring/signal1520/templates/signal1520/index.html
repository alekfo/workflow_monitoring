{% extends 'signal1520/base.html' %}
{% load static %}

{% block title %}
    Main
{% endblock %}

{% block content %}
    <div class="menu-section">
        <h1>Меню</h1>
        <div class="menu">
            <!-- Задачи -->
            <div class="menu-item">
                <button class="button main-btn">📋 Задачи</button>
                <div class="submenu">
                    <button class="sub-button" data-section="tasks_all">📚 Все задачи</button>
                    <button class="sub-button" data-section="tasks_mine">📌 Мои задачи</button>
                    <button class="sub-button" data-section="tasks_add">➕ Добавить задачу</button>
                </div>
            </div>
            <!-- Объекты -->
            <div class="menu-item">
                <button class="button main-btn">🏢 Объекты</button>
                <div class="submenu">
                    <button class="sub-button" data-section="objects_all">🏗️ Все объекты</button>
<button class="sub-button" data-section="objects_add">➕ Добавить объект</button>
                </div>
            </div>
            <!-- Склады -->
            <div class="menu-item">
                <button class="button main-btn">📦 Склады</button>
                <div class="submenu">
                    <button class="sub-button" data-section="warehouses_stock">⏳ В разработке</button>
                </div>
            </div>
            <!-- Отчеты -->
            <div class="menu-item">
                <button class="button main-btn">📊 Отчеты</button>
                <div class="submenu">
                    <button class="sub-button" data-section="reports_download">📄 Акты</button>
                    <button class="sub-button" data-section="reports_download">📄 Сформировать отчет</button>
                    <button class="sub-button" data-section="links_all">🔗 Ссылки на таблицы</button>
                    <button class="sub-button" data-section="links_add">➕ Добавить ссылку</button>
                </div>
            </div>
            <!-- Графики -->
            <div class="menu-item">
                <button class="button main-btn">📈 Графики</button>
                <div class="submenu">
                    <button class="sub-button" data-section="charts_download">⬇️ Выгрузить</button>
                    <button class="sub-button" data-section="charts_add">➕ Добавить</button>
                </div>
            </div>
            <!-- База знаний -->
            <div class="menu-item">
                <button class="button main-btn">📚 База знаний</button>
                <div class="submenu">
                    <button class="sub-button" data-section="alarms">🚨 Алармы</button>
                    <button class="sub-button" data-section="instructions">📖 Инструкции</button>
                    <button class="sub-button" data-section="instructions_add">➕ Добавить инструкцию</button>
                </div>
            </div>
        </div>
    </div>
    <div id="content-panel" class="content-panel">
        <p>Выберите раздел</p>
    </div>

    {% if messages %}
    <div id="toast-container">
        {% for message in messages %}
        <div class="toast toast-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <style>
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            color: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .toast-success { background: linear-gradient(135deg, #27ae60, #229954); }
        .toast-error   { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .toast-warning { background: linear-gradient(135deg, #f39c12, #d68910); }
        .toast-info    { background: linear-gradient(135deg, #3498db, #2980b9); }
    </style>
    <script>
        document.querySelectorAll('.toast').forEach(function(toast) {
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { toast.remove(); }, 500);
            }, 3500);
        });
    </script>

    <style>
        .menu-section h1 {
            color: white;
            border-bottom-color: rgba(255, 255, 255, 0.3);
        }

        .menu-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .button {
            background: linear-gradient(135deg, #00B7B7 0%, #333333 100%);
        }

        .sub-button {
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
{% endblock %}
