<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Аккаунт временно заблокирован</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #d5e0e5 0%, #5fcaca 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(20,60,65,0.18);
        }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #2c3e50; margin-bottom: 12px; }
        p { color: #7f8c8d; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
        .hint {
            background: #fff3cd;
            border-left: 3px solid #f0ad4e;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
            color: #2c3e50;
            text-align: left;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s;
            margin: 6px;
            background: #ecf0f1;
            color: #2c3e50;
        }
        .btn:hover { background: #dfe6e9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#f39c12"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
        <h1>Аккаунт временно заблокирован</h1>
        <p>Зафиксировано слишком много неудачных попыток входа.</p>
        <div class="hint">
            Доступ будет автоматически восстановлен через <strong>1 час</strong>.<br>
            Если вы уверены, что вводили правильный пароль — обратитесь к администратору.
        </div>
        <a href="{% url 'authentication:login' %}" class="btn">Вернуться на страницу входа</a>
    </div>
</body>
</html>
