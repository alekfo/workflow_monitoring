<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аккаунт временно заблокирован</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #333333 0%, #00B7B7 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #2c3e50; margin-bottom: 12px; }
        p { color: #7f8c8d; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
        .hint {
            background: #fff3cd;
            border-left: 3px solid #f0ad4e;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
            color: #2c3e50;
            text-align: left;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s;
            margin: 6px;
            background: #ecf0f1;
            color: #2c3e50;
        }
        .btn:hover { background: #dfe6e9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>Аккаунт временно заблокирован</h1>
        <p>Зафиксировано слишком много неудачных попыток входа.</p>
        <div class="hint">
            Доступ будет автоматически восстановлен через <strong>1 час</strong>.<br>
            Если вы уверены, что вводили правильный пароль — обратитесь к администратору.
        </div>
        <a href="{% url 'authentication:login' %}" class="btn">Вернуться на страницу входа</a>
    </div>
</body>
</html>
