upstream django {
    server web:8000;
}

# Весь HTTP (любой хост, включая IP) → HTTPS fieldlog.ru
# Исключение: ACME-challenge для обновления сертификата Let's Encrypt без даунтайма
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fieldlog.ru$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    server_name fieldlog.ru www.fieldlog.ru;

    ssl_certificate     /etc/letsencrypt/live/fieldlog.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fieldlog.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # Статические файлы — отдаёт Nginx напрямую, не трогая Django
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Внутренний эндпоинт для X-Accel-Redirect из ProtectedMediaView.
    # /media/ намеренно не описан — запросы проксируются через location /
    # в Django, который проверяет авторизацию перед отдачей файла.
    location /protected-media/ {
        internal;
        alias /app/media/;
        expires 7d;
    }

    # Всё остальное — проксируем в Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}