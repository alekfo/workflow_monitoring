upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;  # заменить на домен или IP сервера

    client_max_body_size 20M;

    # Статические файлы — отдаёт Nginx напрямую, не трогая Django
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиафайлы (вложения к замечаниям)
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Всё остальное — проксируем в Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
