{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Восстановление пароля{% endblock %} — Fieldlog</title>
    <link rel="stylesheet" href="{% static 'authentication/css/auth_styles.css' %}?v=20261008">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header"><h2>{% block heading %}Восстановление пароля{% endblock %}</h2></div>
        <div class="auth-body">{% block content %}{% endblock %}</div>
        <div class="auth-footer"><a href="{% url 'authentication:login' %}">Вернуться ко входу</a></div>
    </div>
</div>
</body>
</html>
